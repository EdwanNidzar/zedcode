# ============================================================
# Zedcore — Docker Compose for Hostinger Docker Manager
# ============================================================
# Deploy via: Hostinger hPanel → Docker Manager → Compose
# Or via: GitHub Actions with hostinger/deploy-on-vps
# ============================================================

services:
  # ── Application (Laravel + Nginx + PHP-FPM) ────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/edwannidzar/zedcode:latest
    container_name: zedcore-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APP_NAME: "ZED CORE"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-https://zedcore.example.com}"
      APP_TIMEZONE: Asia/Makassar

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-zedcore}"
      DB_USERNAME: "${DB_USERNAME:-zedcore}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local

      LOG_CHANNEL: stack
      LOG_LEVEL: warning

      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@example.com}"
      MAIL_FROM_NAME: "ZED CORE"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zedcore-net

  # ── MySQL Database ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: zedcore-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-zedcore}"
      MYSQL_USER: "${DB_USERNAME:-zedcore}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zedcore-net

volumes:
  app-storage:
    driver: local
  db-data:
    driver: local

networks:
  zedcore-net:
    driver: bridge
